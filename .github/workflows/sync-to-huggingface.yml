name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Hugging Face CLI
        run: python -m pip install --upgrade huggingface_hub

      - name: Upload backend to existing Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          hf upload tourismproject/backendtouruni . \
            --repo-type space \
            --exclude ".git*" \
            --exclude ".github/*" \
            --exclude ".DS_Store" \
            --exclude ".pytest_cache/*" \
            --exclude "venv/*" \
            --exclude "reactui/*" \
            --exclude "mobile/*" \
            --exclude "docs/*" \
            --exclude "data/*" \
            --exclude "emotion_test_outputs/*" \
            --exclude "**/__pycache__/*" \
            --exclude "**/*.pyc" \
            --delete "*" \
            --commit-message "Sync backend from GitHub"
